spring:
  application:
    name: fitodiagnostico

  # Perfil por defecto: H2 en memoria. Útil para desarrollo local y pruebas
  # de arranque sin depender de un servidor externo.
  datasource:
    url: jdbc:h2:mem:fitodiagnostico;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # RO-07: el esquema sólo cambia por migración Flyway versionada.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

logging:
  level:
    root: INFO
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN

---

# Perfil `postgres`: credenciales por variable de entorno (RO-06),
# cero secretos en este archivo.
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN
