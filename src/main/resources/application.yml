# fitodiagnostico.tabla-referencia: fuente de la tabla de referencia de
# especies (RA-05). "csv" (por defecto si se omite la propiedad, vía
# matchIfMissing) usa infraestructura.referencia.AdaptadorEspeciesCsv, que lee
# src/main/resources/referencia/especies.csv sin tocar la base de datos. "bd"
# activa infraestructura.persistencia.AdaptadorEspecieJpa (JPA + Flyway).
# Tensión conocida: H2 y Flyway arrancan igual en modo csv, porque el
# datasource y las migraciones de este perfil no dependen de esta propiedad.
# fitodiagnostico:
#   tabla-referencia: csv

# fitodiagnostico.cors.origenes: lista separada por comas de orígenes con
# permiso de CORS sobre /api/** (RA7, web.ConfiguracionCors). Por defecto
# http://localhost:5500,http://127.0.0.1:5500 (el front servido con
# `python3 -m http.server 5500` en desarrollo). En otros ambientes se
# sobreescribe con el/los orígenes reales del front.
# fitodiagnostico:
#   cors:
#     origenes: http://localhost:5500,http://127.0.0.1:5500

spring:
  application:
    name: fitodiagnostico

  # RA6/sección 2 del contrato: una ruta que no existe debe caer en
  # ManejadorGlobalDeErrores como cualquier otra excepción (404
  # RECURSO_NO_ENCONTRADO), no en el 404 sin cuerpo que produce por defecto
  # el manejador de recursos estáticos de Spring MVC.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Perfil por defecto: H2 en memoria. Útil para desarrollo local y pruebas
  # de arranque sin depender de un servidor externo.
  datasource:
    url: jdbc:h2:mem:fitodiagnostico;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # RO-07: el esquema sólo cambia por migración Flyway versionada.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

logging:
  level:
    root: INFO
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN

---

# Perfil `postgres`: credenciales por variable de entorno (RO-06),
# cero secretos en este archivo.
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN
