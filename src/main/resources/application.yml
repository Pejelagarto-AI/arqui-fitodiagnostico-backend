# Catálogo de especies (D14): la base de datos es la única fuente en ejecución.
# El CSV src/main/resources/referencia/especies.csv son datos semilla: la
# clase adaptador.salida.csv.SembradorDeEspecies lo carga a la base al
# arrancar, solo si la tabla `especie` está vacía. Desde ahí el administrador
# edita, desactiva y reactiva especies con la API; el CSV no vuelve a leerse.
# (Ya no existe la propiedad fitodiagnostico.tabla-referencia ni el modo csv.)

# fitodiagnostico.cors.origenes: lista separada por comas de orígenes con
# permiso de CORS sobre /api/** (RA7, adaptador.entrada.rest.ConfiguracionCors). Por defecto
# http://localhost:5500,http://127.0.0.1:5500 (el front servido con
# `python3 -m http.server 5500` en desarrollo). En otros ambientes se
# sobreescribe con el/los orígenes reales del front.
# fitodiagnostico:
#   cors:
#     origenes: http://localhost:5500,http://127.0.0.1:5500

# Seguridad (corte 2). SIN valores por defecto a propósito: ninguna credencial ni
# secreto vive en el repositorio fuera del perfil `test` (src/test/resources).
#   FITO_JWT_SECRETO        obligatoria. Firma de los JWT (HS256), mínimo 32 bytes.
#                           Si falta, la aplicación no arranca.
#                           Ej.: export FITO_JWT_SECRETO="$(openssl rand -base64 48)"
#   FITO_ADMIN_CORREO       correo y contraseña del primer administrador, usados al
#   FITO_ADMIN_CONTRASENA   arrancar SOLO si todavía no existe ningún administrador.
#                           Contraseña de al menos 8 caracteres.
#   FITO_JWT_EXPIRACION     opcional, duración ISO-8601 del token (por defecto PT2H).
#   FITO_BCRYPT_COSTE       opcional, costo de BCrypt (por defecto 10).

# Bloque 4: correo y enlaces al front. Todo por variable de entorno y con valores
# de desarrollo que apuntan a Mailpit (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit;
# bandeja en http://localhost:8025). Ninguno es secreto salvo la contraseña SMTP.
#   FITO_SMTP_HOST / FITO_SMTP_PUERTO   servidor SMTP (por defecto localhost:1025, Mailpit).
#   FITO_SMTP_USUARIO / FITO_SMTP_CONTRASENA   credenciales SMTP; vacías = sin autenticación.
#   FITO_SMTP_AUTH / FITO_SMTP_STARTTLS   "true" cuando el servidor lo exige (SMTP real).
#   FITO_CORREO_REMITENTE   dirección "De:" de los correos.
#   FITO_CORREO_ASINCRONO   "false" para enviar en el mismo hilo (por defecto true).
#   FITO_FRONT_URL          base de los enlaces de los correos (invitación y restablecimiento).
fitodiagnostico:
  seguridad:
    jwt:
      secreto: ${FITO_JWT_SECRETO}
      expiracion: ${FITO_JWT_EXPIRACION:PT2H}
    bcrypt-coste: ${FITO_BCRYPT_COSTE:10}
  admin:
    correo: ${FITO_ADMIN_CORREO:}
    contrasena: ${FITO_ADMIN_CONTRASENA:}
  front:
    url: ${FITO_FRONT_URL:http://localhost:5500}
  correo:
    remitente: ${FITO_CORREO_REMITENTE:no-responder@fitodiagnostico.local}
    asincrono: ${FITO_CORREO_ASINCRONO:true}


# RA1: sin esto, un error que por algún motivo no pase por
# ManejadorGlobalDeErrores ni por adaptador.entrada.rest.ControladorDeErrores podría caer en la
# página blanca (whitelabel) de Spring Boot, que es HTML. Con
# ControladorDeErrores registrado como ErrorController esto ya no debería
# pasar, pero se deja explícito como cinturón de seguridad.
server:
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: fitodiagnostico

  # RA6/sección 2 del contrato: una ruta que no existe debe caer en
  # ManejadorGlobalDeErrores como cualquier otra excepción (404
  # RECURSO_NO_ENCONTRADO), no en el 404 sin cuerpo que produce por defecto
  # el manejador de recursos estáticos de Spring MVC.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Perfil por defecto: H2 en memoria. Útil para desarrollo local y pruebas
  # de arranque sin depender de un servidor externo. Con el modo csv eliminado
  # (D14) la base siempre es la fuente, así que Flyway y el datasource ya no
  # son una tensión: se usan en cualquier configuración.
  datasource:
    url: jdbc:h2:mem:fitodiagnostico;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Correo saliente (D13, D54). Spring Boot crea el JavaMailSender con esto.
  mail:
    host: ${FITO_SMTP_HOST:localhost}
    port: ${FITO_SMTP_PUERTO:1025}
    username: ${FITO_SMTP_USUARIO:}
    password: ${FITO_SMTP_CONTRASENA:}
    properties:
      mail:
        smtp:
          auth: ${FITO_SMTP_AUTH:false}
          starttls:
            enable: ${FITO_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # RA1: la consola web de H2 sirve HTML y no tiene lugar en un backend que
  # solo responde JSON; deshabilitada en todos los perfiles.
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      # RO-07: el esquema sólo cambia por migración Flyway versionada.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

logging:
  level:
    root: INFO
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN

---

# Perfil `postgres`: credenciales por variable de entorno (RO-06),
# cero secretos en este archivo.
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.vivero.fitodiagnostico: INFO
    org.hibernate.SQL: WARN
