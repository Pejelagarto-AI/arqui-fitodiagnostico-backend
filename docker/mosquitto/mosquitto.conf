# Broker de DESARROLLO para la fase 4 (lecturas del dispositivo por MQTT). Ver docs/fase4/IMPLEMENTACION.md (D83).
# Anonimo a proposito: la autenticacion la hace el backend verificando el JWT que viaja en cada mensaje.
# NO exponer este puerto fuera de la maquina de desarrollo.
listener 1883
allow_anonymous true
# Las sesiones persistentes (cleanSession=false) y los mensajes QoS 1 pendientes sobreviven mientras el broker viva.
persistence true
persistence_location /mosquitto/data/
