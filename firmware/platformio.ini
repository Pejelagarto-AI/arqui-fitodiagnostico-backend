; Firmware de la matera (gemelo real de simulador/simulador_esp32.py --serial auto).
; Los secretos y la red de la prueba viven en local.ini (no se versiona; ver local.ini.ejemplo).

[platformio]
default_envs = esp32dev
extra_configs = local.ini

; Valores por defecto: local.ini los pisa. Vacio = "no hay": la clave de flota vacia detiene el firmware con un aviso
; en pantalla, y sin SSID o servidor se usa el portal cautivo.
[fito]
clave_flota =
wifi_ssid =
wifi_clave =
servidor =
puerto_api = 8080
puerto_front = 5500

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
; Con el stub de esptool a velocidad alta la subida fallo una vez ("Failed to start stub flasher") en esta placa.
upload_speed = 115200
; Si aun asi falla, descomente la linea: sube sin el stub (mas lento, pero funciona):
; upload_flags = --no-stub
lib_deps =
    adafruit/Adafruit SSD1306@2.5.15
    adafruit/Adafruit GFX Library@1.12.4
    ricmoo/QRCode@0.0.1
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFITO_CLAVE_FLOTA=\"${fito.clave_flota}\"
    -DFITO_WIFI_SSID=\"${fito.wifi_ssid}\"
    -DFITO_WIFI_CLAVE=\"${fito.wifi_clave}\"
    -DFITO_SERVIDOR=\"${fito.servidor}\"
    -DFITO_PUERTO_API=${fito.puerto_api}
    -DFITO_PUERTO_FRONT=${fito.puerto_front}

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
